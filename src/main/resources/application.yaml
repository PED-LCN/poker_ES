spring:
  application:
    name: poker-api
  datasource:
    url: jdbc:postgresql://localhost:5432/poker-api
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
server:
  port: 8081